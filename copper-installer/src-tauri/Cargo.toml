[package]
name = "copper-setup"
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
# запись Copper в «Приложениях»: найти установленную копию для обновления поверх
windows-registry = "0.6"

[workspace]
