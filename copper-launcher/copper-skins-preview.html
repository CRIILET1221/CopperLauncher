<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copper · Скины</title><style>@font-face{font-family:Geist;src:url('/fonts/Geist-Variable.woff2')}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 20%,#2b4135,#151d18 75%);color:#e5e9df;font:14px Geist,'Segoe UI',sans-serif;--m-fg:#e5e9df;--px-10:polygon(10px 0,calc(100% - 10px) 0,calc(100% - 10px) 10px,100% 10px,100% calc(100% - 10px),calc(100% - 10px) calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,10px calc(100% - 10px),0 calc(100% - 10px),0 10px,10px 10px)}.btn{font:inherit;cursor:pointer;border:0;padding:10px 14px;color:#e5e9df;background:#354439;font-weight:750;box-shadow:inset 0 3px #ffffff16,inset 0 -4px #0004;clip-path:var(--px-10)}.btn:active{transform:translateY(2px)}.btn.primary{background:#bfd49f;color:#142017}.btn.sm{padding:8px 12px}.btn:disabled{opacity:.45;cursor:default}#demo{position:fixed;z-index:450;bottom:8px;left:12px;font-size:12px}#demo button{margin-left:12px}</style></head><body><div id="root"></div><div id="demo">Предпросмотр интерфейса · применение доступно в приложении<button class="btn" id="sample">Загрузить пример</button><button class="btn" id="open">Открыть окно</button></div><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';import {CopperSkins} from '/src/modals/CopperSkins.tsx';
const root=createRoot(document.getElementById('root'));function open(){root.render(React.createElement(CopperSkins,{onClose:()=>root.render(null)}))}open();document.getElementById('open').onclick=open;
document.getElementById('sample').onclick=async()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.fillStyle='#b57b52';g.fillRect(0,0,64,32);g.fillStyle='#57aaaa';g.fillRect(16,16,24,16);g.fillStyle='#4663b0';g.fillRect(0,16,16,16);g.fillRect(16,48,16,16);g.fillStyle='#b57b52';g.fillRect(32,48,16,16);g.fillStyle='#3d2520';g.fillRect(8,8,8,2);g.fillStyle='white';g.fillRect(9,11,2,1);g.fillRect(13,11,2,1);g.fillStyle='#372022';g.fillRect(10,14,4,1);g.clearRect(32,0,32,16);g.fillStyle='#47cb87';g.fillRect(40,10,8,1);const blob=await new Promise(r=>c.toBlob(r,'image/png'));const files=new DataTransfer();files.items.add(new File([blob],'Copper-пример.png',{type:'image/png'}));document.querySelector('[data-copper-skins]')?.dispatchEvent(new DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:files}));};
</script></body></html>
