<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copper Launcher</title>
<meta name="color-scheme" content="dark">
<link rel="preload" href="/copper-brand-v2.png" as="image">
<link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
html,body{margin:0;background:#151b18}
#boot{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;display:grid;place-items:center;background:#151b18;transition:opacity .34s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot img{width:112px;height:112px;object-fit:contain;image-rendering:pixelated}
@media (prefers-reduced-motion: reduce){#boot{transition:none}}
</style>
<script src="/boot.js"></script>
<link rel="icon" href="/copper-app-icon.png" type="image/png">
</head>
<body>
<div id="boot" aria-hidden="true"><img src="/copper-brand-v2.png" alt="" width="112" height="112" fetchpriority="high"></div>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
