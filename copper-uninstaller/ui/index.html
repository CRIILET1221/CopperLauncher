<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Удаление Copper</title><link rel="stylesheet" href="uninstall.css"></head>
<body><header class="titlebar" data-tauri-drag-region><img src="copper-app-icon.png" alt="">COPPER LAUNCHER<button id="close" aria-label="Закрыть">×</button></header>
<main><img class="logo" src="copper-app-icon.png" alt="Медный блок Copper"><h1 id="title">Удаление Copper</h1><p class="subtitle" id="subtitle">Лаунчер и его ярлыки будут удалены.<br>Инстансы, миры и аккаунты останутся.</p>
<div class="plate" id="confirmation"><span class="caption">Папка установки</span><p id="path">Проверяем установку…</p></div>
<div class="plate" id="progress" hidden><div id="stage" role="status">Подготовка…</div><div class="bar" role="progressbar" aria-label="Удаление Copper" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div><b id="percent">0%</b></div>
<p class="error" id="error" role="alert" hidden></p>
<footer><button class="btn secondary" id="cancel">Оставить Copper</button><button class="btn primary" id="action" disabled>Удалить Copper</button></footer></main><script src="uninstall.js"></script></body></html>
