<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><link rel="stylesheet" href="startup.css"><link rel="preload" href="startup-logo.png" as="image"><title>Удаление Copper</title><link rel="stylesheet" href="uninstall.css"><link rel="stylesheet" href="copper-controls.css"><link rel="stylesheet" href="pixel-buttons.css"></head>
<body><div id="copper-startup" aria-hidden="true"><img src="startup-logo.png" alt="" width="112" height="112" fetchpriority="high"></div><header class="titlebar" data-tauri-drag-region><img src="copper-app-icon.png" alt="">COPPER LAUNCHER<button class="copper-window-close" id="close" aria-label="Закрыть"><svg width="16" height="16" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" shape-rendering="crispEdges"><rect x="2" y="2" width="2" height="1" fill="currentColor"/><rect x="8" y="2" width="2" height="1" fill="currentColor"/><rect x="2" y="3" width="3" height="1" fill="currentColor"/><rect x="7" y="3" width="3" height="1" fill="currentColor"/><rect x="3" y="4" width="6" height="1" fill="currentColor"/><rect x="4" y="5" width="4" height="1" fill="currentColor"/><rect x="4" y="6" width="4" height="1" fill="currentColor"/><rect x="3" y="7" width="6" height="1" fill="currentColor"/><rect x="2" y="8" width="3" height="1" fill="currentColor"/><rect x="7" y="8" width="3" height="1" fill="currentColor"/><rect x="2" y="9" width="2" height="1" fill="currentColor"/><rect x="8" y="9" width="2" height="1" fill="currentColor"/></svg></button></header>
<main><img class="logo" src="copper-app-icon.png" alt="Монограмма Copper"><h1 id="title">Удаление Copper</h1><p class="subtitle" id="subtitle">Лаунчер и его ярлыки будут удалены.<br>Инстансы, миры и аккаунты останутся.</p>
<div class="plate" id="confirmation"><span class="caption">Папка установки</span><p id="path">Проверяем установку…</p><div class="cleanup-option"><button class="btn sm secondary" id="clear-data" data-pixel-icon="mo-trash" type="button" aria-pressed="false">Также удалить данные Copper</button><p>Настройки, сохранённые входы, локальные скины и кэш.<br>Инстансы и миры останутся. Очистка выполнится при удалении.</p></div></div>
<div class="plate" id="progress" hidden><div id="stage" role="status">Подготовка…</div><div class="bar" role="progressbar" aria-label="Удаление Copper" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div><b id="percent">0%</b></div>
<p class="error" id="error" role="alert" hidden></p>
<footer><button class="btn secondary" id="cancel" data-pixel-icon="x">Оставить Copper</button><button class="btn primary" id="action" data-pixel-icon="mo-trash" disabled>Удалить Copper</button></footer></main><script src="copper-controls.js"></script><script src="startup.js"></script><script src="uninstall.js"></script></body></html>
